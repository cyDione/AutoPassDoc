[package]
name = "app-core"
version = "0.1.0"
edition = "2024"
description = "AutoPassDoc application logic: settings, reviewers, AI fixes, knowledge base glue"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
docx-engine = { path = "../docx-engine" }
models = { version = "0.1.0", path = "../models" }
kb = { path = "../kb" }
futures = "0.3"
encoding_rs = "0.8.42"
percent-encoding = "2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["sync", "time", "rt"] }
zip = "8.6.0"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
