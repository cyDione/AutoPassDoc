[package]
name = "autopassdoc"
version = "0.1.0"
description = "AutoPassDoc：按批注智能改稿的 Word 桌面工具"
edition = "2024"

[lib]
name = "autopassdoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
docx-engine = { path = "../crates/docx-engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
tauri-plugin-opener = "2"
